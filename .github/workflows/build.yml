name: build

# Build across every supported target, triggered manually or by a tag push.
# Each target builds on a native runner rather than cross-compiling.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          install-mode: goinstall
          args: ./...

      # Unit tests run against the packages directly; the black-box suite runs
      # separately below against the uploaded static binary.
      - name: unit tests
        shell: bash
        run: go test $(go list ./... | grep -v '/e2e$')

      - name: build
        # bash keeps the mkdir and output path portable across the native
        # runners used for each target.
        shell: bash
        env:
          # Native compilation: the runner's own OS/arch matches the target, so
          # cgo stays enabled and no cross toolchain is required. libghostty-vt
          # links statically, yielding a self-contained cli binary.
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          # Stamp the release version on tag builds so `bgx version` reports the
          # shipped tag rather than the in-source dev placeholder.
          ldflags=""
          if [ "$REF_TYPE" = tag ]; then
            ldflags="-X github.com/sidedotdev/bgx.version=${REF_NAME#v}"
          fi
          go build -ldflags "$ldflags" -o "dist/bgx-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/bgx

      # Run the full black-box suite against the exact static binary that gets
      # uploaded, verifying the release artifact itself end to end.
      - name: black-box tests
        shell: bash
        env:
          BGX_E2E_BIN: ${{ github.workspace }}/dist/bgx-${{ matrix.goos }}-${{ matrix.goarch }}
        run: go test ./e2e/...

      - uses: actions/upload-artifact@v4
        with:
          name: bgx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

      # Tag pushes carry a pre-release created by the release script; attach
      # each platform's binary so the release script can verify and promote it.
      - name: upload to release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber